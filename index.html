<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Italy and Croatia 2027 travel itinerary">
    <title>Italy &amp; Croatia 2027</title>
    <style>
        :root {
            --italy-green: #1f7a5a;
            --croatia-blue: #174a7e;
            --cream: #fffaf0;
            --line: #d8dee6;
            --text: #24313d;
            --white: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 32px 18px;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, #f3f8f5 0%, #f4f7fb 55%, var(--cream) 100%);
        }

        .page {
            width: min(1400px, 100%);
            margin: 0 auto;
            background: var(--white);
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(23, 74, 126, 0.12);
            overflow: hidden;
        }

        header {
            padding: 32px 24px;
            text-align: center;
            color: var(--white);
            background: linear-gradient(110deg, var(--italy-green), var(--croatia-blue));
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2rem, 5vw, 3.4rem);
            letter-spacing: 0.02em;
        }

        header p {
            margin: 10px 0 0;
            opacity: 0.92;
        }

        .table-wrap {
            padding: 24px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 980px;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th, td {
            border: 1px solid var(--line);
            padding: 12px 10px;
            vertical-align: top;
            text-align: left;
        }

        th {
            color: var(--white);
            background: var(--croatia-blue);
            font-size: 0.92rem;
            letter-spacing: 0.03em;
        }

        tbody tr:nth-child(even) { background: #f7fafc; }
        tbody tr:hover { background: #eef7f3; }

        td {
            height: 54px;
            line-height: 1.4;
        }

        td[contenteditable="true"]:focus {
            outline: 3px solid rgba(31, 122, 90, 0.22);
            background: #fffef4;
        }

        th:nth-child(1), td:nth-child(1) { width: 6%; text-align: center; font-weight: 700; }
        th:nth-child(2), td:nth-child(2) { width: 13%; }
        th:nth-child(3), td:nth-child(3) { width: 12%; }
        th:nth-child(4), td:nth-child(4) { width: 27%; }
        th:nth-child(5), td:nth-child(5) { width: 13%; }
        th:nth-child(6), td:nth-child(6) { width: 29%; }

        footer {
            padding: 0 24px 24px;
            color: #647180;
            font-size: 0.88rem;
            text-align: center;
        }

        @media print {
            body { padding: 0; background: white; }
            .page { box-shadow: none; border-radius: 0; }
            header { padding: 18px; }
            .table-wrap { padding: 10px; overflow: visible; }
            table { min-width: 0; font-size: 9pt; }
            th, td { padding: 6px; }
            td { height: 32px; }
        }
    </style>
</head>
